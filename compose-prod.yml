services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-shipyard}"
      POSTGRES_USER: "${POSTGRES_USER:-shipyard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mySecure(!)Password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipyard} -d ${POSTGRES_DB:-shipyard}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
    - ./data/db:/var/lib/postgresql/data

  rmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-shipyard}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-mySecure(!)Password}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
    - "15672:15672"
    deploy:
      restart_policy:
        condition: on-failure

  selenium:
    image: selenium/standalone-chromium:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4444/wd/hub/status | grep -q 'ready'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure

  api:
    image: ethergizmos/shipyard-api:latest
    environment:
      ASPNETCORE_URLS: http://+:8080
      SHIPYARD_BOOTSTRAP_USER: "${SHIPYARD_BOOTSTRAP_USER:-admin}"
      SHIPYARD_BOOTSTRAP_PASSWORD: "${SHIPYARD_BOOTSTRAP_PASSWORD:-passowrd}"
      # SHIPYARD_BOOTSTRAP_FORCE: true
      Database__ConnectionId: ComposeDb
      Connections__ComposeDb__Type: Database
      Connections__ComposeDb__PostgreSql__ConnectionString: Host=db;Database=${POSTGRES_DB:-shipyard};Username=${POSTGRES_USER:-shipyard};Password=${POSTGRES_PASSWORD:-mySecure(!)Password}
      RabbitMq__ConnectionString: amqp://${RABBITMQ_USER:-shipyard}:${RABBITMQ_PASSWORD:-mySecure(!)Password}@rmq:5672
      Security__OAuth2__WebUIRedirectUrls__0: http://localhost:7447/login/callback
      Security__OAuth2__DisableTransportSecurityRequirement: true
      Security__OAuth2__EncryptionCertificate__CertificateId: AuthEncryption
      Security__Certificates__AuthEncryption__Type: Certificate
      Security__Certificates__AuthEncryption__Text__PublicKey: -----BEGIN CERTIFICATE----------END CERTIFICATE-----
      Security__Certificates__AuthEncryption__Text__PrivateKey: -----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
      Security__OAuth2__SigningCertificate__CertificateId: AuthSigning
      Security__Certificates__AuthSigning__Type: Certificate
      Security__Certificates__AuthSigning__Text__PublicKey: -----BEGIN CERTIFICATE----------END CERTIFICATE-----
      Security__Certificates__AuthSigning__Text__PrivateKey: -----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
    depends_on:
      db: { condition: service_healthy }
      rmq: { condition: service_healthy }
    ports:
    - "${SHIPYARD_API_PORT:-7448}:8080"
    deploy:
      restart_policy:
        condition: on-failure

  worker:
    image: ethergizmos/shipyard-worker:latest
    environment:
      Database__ConnectionId: ComposeDb
      Connections__ComposeDb__Type: Database
      Connections__ComposeDb__PostgreSql__ConnectionString: Host=db;Database=${POSTGRES_DB:-shipyard};Username=${POSTGRES_USER:-shipyard};Password=${POSTGRES_PASSWORD:-mySecure(!)Password}
      RabbitMq__ConnectionString: amqp://${RABBITMQ_USER:-shipyard}:${RABBITMQ_PASSWORD:-mySecure(!)Password}@rmq:5672
      Selenium__ConnectionString: http://selenium:4444/wd/hub
      # Connections__MySmtp__Type: Email
      # Connections__MySmtp__Smtp__Host: "${SMTP_HOST}"
      # Connections__MySmtp__Smtp__Port: "${SMTP_PORT}"
      # Connections__MySmtp__Smtp__Username: "${SMTP_USER}"
      # Connections__MySmtp__Smtp__Password: "${SMTP_PASSWORD}"
      # Connections__MySmtp__Smtp__UseTls: true
      # Notifications__IsEnabled: true
      # Notifications__Email__IsEnabled: true
      # Notifications__Email__ConnectionId: MySmtp
      # Notifications__Email__To__0: "${SMTP_RECIPIENT}"
    depends_on:
      db: { condition: service_healthy }
      rmq: { condition: service_healthy }
      selenium: { condition: service_healthy }
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: ethergizmos/shipyard-web:latest
    environment:
      CONFIG__resourceServer: "${SHIPYARD_API_HOST:-http://localhost:7448}/api/v1"
      CONFIG__oauth__authority: "${SHIPYARD_API_HOST:-http://localhost:7448}"
    ports:
    - "${SHIPYARD_WEB_PORT:-7447}:8080"
    deploy:
      restart_policy:
        condition: on-failure
