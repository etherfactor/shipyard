services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-shipyard}"
      POSTGRES_USER: "${POSTGRES_USER:-shipyard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mySecure(!)Password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipyard} -d ${POSTGRES_DB:-shipyard}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
    - ./data/db:/var/lib/postgresql/data

  rmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-shipyard}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-mySecure(!)Password}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
    - "15672:15672"
    deploy:
      restart_policy:
        condition: on-failure

  selenium:
    image: selenium/standalone-chromium:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4444/wd/hub/status | grep -q 'ready'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure

  api:
    image: etherfactor/shipyard-api:latest
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${SHIPYARD_USE_PROXY:-false}
      SHIPYARD_BOOTSTRAP_USER: "${SHIPYARD_BOOTSTRAP_USER:-admin}"
      SHIPYARD_BOOTSTRAP_PASSWORD: "${SHIPYARD_BOOTSTRAP_PASSWORD:-password}"
      # SHIPYARD_BOOTSTRAP_FORCE: true
      Database__ConnectionId: ComposeDb
      MessageBroker__ConnectionId: ComposeAmqp
      Artifacts__BasePath: /opt/artifacts
      Artifacts__Database__ConnectionId: ComposeDb
      Connections__ComposeDb__Type: Database
      Connections__ComposeDb__PostgreSql__ConnectionString: Host=db;Database=${POSTGRES_DB:-shipyard};Username=${POSTGRES_USER:-shipyard};Password=${POSTGRES_PASSWORD:-mySecure(!)Password}
      Connections__ComposeAmqp__Type: MessageBroker
      Connections__ComposeAmqp__RabbitMQ__ConnectionString: amqp://${RABBITMQ_USER:-shipyard}:${RABBITMQ_PASSWORD:-mySecure(!)Password}@rmq:5672
      Security__OAuth2__WebUIRedirectUrls__0: ${SHIPYARD_WEB_HOST:-http://localhost:7447}/login/callback
      Security__OAuth2__WorkerClientSecret: ${SHIPYARD_WORKER_CLIENT_SECRET}
      Security__OAuth2__DisableTransportSecurityRequirement: true
      Security__OAuth2__EncryptionCertificate__CertificateId: AuthEncryption
      Security__Certificates__AuthEncryption__Type: ${SHIPYARD_ENC_TYPE:-PfxFile}
      Security__Certificates__AuthEncryption__File__Path: ${SHIPYARD_ENC_PATH:-/opt/certificates/auth-encryption.pfx}
      Security__Certificates__AuthEncryption__File__AutoGenerate: true
      Security__OAuth2__SigningCertificate__CertificateId: AuthSigning
      Security__Certificates__AuthSigning__Type: ${SHIPYARD_SIGN_TYPE:-PfxFile}
      Security__Certificates__AuthSigning__File__Path: ${SHIPYARD_SIGN_PATH:-/opt/certificates/auth-signing.pfx}
      Security__Certificates__AuthSigning__File__AutoGenerate: true
      LogIngestion__Sources__WebUI__ApiKey: ${SHIPYARD_WEB_LOG_APIKEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }
      rmq: { condition: service_healthy }
    ports:
    - "${SHIPYARD_API_PORT:-7448}:8080"
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
    - ./data/artifacts:/opt/artifacts
    - ./data/certificates:/opt/certificates

  worker:
    image: etherfactor/shipyard-worker:latest
    environment:
      Worker__DefaultTimeZone: ${SHIPYARD_DEFAULT_TZ:-America/Chicago}
      MessageBroker__ConnectionId: ComposeAmqp
      Connections__ComposeAmqp__Type: MessageBroker
      Connections__ComposeAmqp__RabbitMQ__ConnectionString: amqp://${RABBITMQ_USER:-shipyard}:${RABBITMQ_PASSWORD:-mySecure(!)Password}@rmq:5672
      Selenium__ConnectionString: http://selenium:4444/wd/hub
      Api__BaseUrl: ${SHIPYARD_API_HOST:-http://localhost:7448}
      Api__OAuth2__ClientId: ${SHIPYARD_WORKER_CLIENT_ID:-608b511a-737b-4e9a-90f5-64fb86b8469f}
      Api__OAuth2__ClientSecret: ${SHIPYARD_WORKER_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'EtherGizmos.Shipyard.Worker' /proc/1/cmdline && bash -c '</dev/tcp/rmq/5672'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }
      db: { condition: service_healthy }
      rmq: { condition: service_healthy }
      selenium: { condition: service_healthy }
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: etherfactor/shipyard-web:latest
    environment:
      CONFIG__resourceServer: "${SHIPYARD_API_HOST:-http://localhost:7448}/api/v1"
      CONFIG__oauth__authority: "${SHIPYARD_API_HOST:-http://localhost:7448}"
      CONFIG__logging__endpoint: "${SHIPYARD_API_HOST:-http://localhost:7448}/api/v1/logs}"
      CONFIG__logging__apiKey: ${SHIPYARD_WEB_LOG_APIKEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/assets/config.json || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
    - "${SHIPYARD_WEB_PORT:-7447}:8080"
    deploy:
      restart_policy:
        condition: on-failure
