<div class="offcanvas-header">
  <h5 class="offcanvas-title" id="offcanvasExampleLabel">
    Shipyard
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="close(0)"></button>
</div>

<div class="offcanvas-body pt-0 px-2">

  <div class="list-group list-group-flush">

    <!-- Dashboard -->
    <a [routerLink]="['/']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-speedometer me-2"></i>
      Dashboard
    </a>

    <!-- Packages -->
    <a [routerLink]="['/packages']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-box-seam me-2"></i>
      Packages
    </a>

    <!-- Carriers -->
    <a [routerLink]="['/carriers']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-truck me-2"></i>
      Carriers
    </a>

    <!-- Notification Logs -->
    <!--<a [routerLink]="['/notifications']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-bell me-2"></i>
      Notifications
    </a>-->

    <!-- Settings -->
    <!--<a [routerLink]="['/settings']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-gear me-2"></i>
      Settings
    </a>-->

    <!-- System/Debug Info -->
    <!--<a [routerLink]="['/system']" class="list-group-item list-group-item-action d-flex align-items-center" (click)="dismiss(0)">
      <i class="bi bi-hdd-network me-2"></i>
      System Info
    </a>-->

  </div>

  <hr class="my-3" />

  <div class="text-muted small pt-0 px-3 pb-3" style="padding: 0 16px 8px 16px;">

    <div class="mt-2">
      <i class="bi bi-info-circle me-1"></i>
      Version: {{version$$()}}
    </div>

    <div class="mt-2">
      <i class="bi bi-clock me-1"></i>
      Server Time: TBD
    </div>

  </div>

</div>
