<div class="row">
  <!-- Header -->
  <detail-header text="Packages"
                 subtext="View your packages."
                 class="mt-3" />
</div>

<detail-box icon="bi-chat-square-text"
            text="Packages List"
            class="mt-3">
  <div class="mt-3">
    <app-table [data]="records" [minRows]="perPage" [isLoading]="isLoading()"
               [sort]="activeSort" (sortChange)="onSortChange($event)"
               (filterChange)="onFilterChange($event)">
      <ng-template #headers>
        <th app-table-header="name" type="string" [sortable]="true" [filterable]="true">Name</th>
        <th app-table-header="createdAt" type="datetime" [sortable]="true" [filterable]="true">Created at</th>
        <th>Actions</th>
      </ng-template>

      <ng-template #rows let-row>
        <td>{{row.name}}</td>
        <td>{{row.createdAt.startOf('minute').toLocaleString({ month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}}</td>
        <td><a [routerLink]="['/channel/', row.id]">View</a></td>
      </ng-template>
    </app-table>
  </div>
</detail-box>
