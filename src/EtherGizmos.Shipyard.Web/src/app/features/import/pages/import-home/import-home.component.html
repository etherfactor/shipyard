<!-- Header -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-header [text]="'Import'"
                   [subtext]="'Import YAML or JSON configuration into Shipyard'" />
  </div>
</div>

<!-- Import file -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-upload" text="Import Source">

      <div class="row mt-3">
        <div class="col-md-4">
          <label class="form-label">Import method</label>

          <ng-select [(ngModel)]="sourceType"
                     [clearable]="false"
                     [selectOnTab]="true">
            <ng-option value="file">
              <span class="bi bi-file-earmark-arrow-up me-1"></span>
              Upload file
            </ng-option>
            <ng-option value="paste">
              <span class="bi bi-clipboard me-1"></span>
              Paste document
            </ng-option>
          </ng-select>
        </div>

        <div class="col-md-8">
          @if (sourceType === 'file') {
          <label for="importFile" class="form-label">File</label>
          <input id="importFile"
                 type="file"
                 class="form-control"
                 accept=".yaml,.yml,.json,application/yaml,application/json" />

          <div class="form-text">
            Upload a Shipyard export document in YAML or JSON format.
          </div>
          } @else {
          <label for="importText" class="form-label">Document</label>
          <textarea id="importText"
                    class="form-control font-monospace"
                    rows="12"
                    placeholder="kind: carrier&#10;schemaVersion: 1&#10;data: ..."></textarea>
          }
        </div>
      </div>

      <div class="d-flex justify-content-end mt-3">
        <button type="button" class="btn btn-primary">
          <span class="bi bi-check2-square me-1"></span>
          Validate
        </button>
      </div>

    </detail-box>
  </div>
</div>

@let document = document$$();
@if (document) {
<!-- Preview -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-file-earmark-code" text="Detected Document">

      <div class="row mt-3">
        <div class="col-12">
          <div class="col-md-6">
            <div class="row mt-3">
              <label class="col-sm-4 col-form-label">Kind</label>
              <div class="col-sm-8">
                <input type="text" [value]="document.kind ?? '—'" [readonlyForm]="true" />
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="row mt-3">
              <label class="col-sm-4 col-form-label">Schema Version</label>
              <div class="col-sm-8">
                <input type="text" [value]="document.schemaVersion ?? '—'" [readonlyForm]="true" />
              </div>
            </div>
          </div>
        </div>
      </div>

    </detail-box>
  </div>
</div>
}
