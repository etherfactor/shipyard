<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 16px);">
  <div class="card shadow-sm rounded-4 position-relative" style="max-width: 460px; width: 100%; border-color: var(--bs-primary);">
    <div class="card-body p-4 p-md-5">

      <!-- Brand -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="rounded-circle d-flex align-items-center justify-content-center"
             style="width: 48px; height: 48px; background: rgba(13,110,253,.08);">
          <i class="bi bi-box-seam-fill fs-4 text-primary" aria-hidden="true"></i>
        </div>
        <div>
          <h1 class="h4 mb-0">Shipyard</h1>
          <div class="text-secondary small">Sign in to continue</div>
        </div>
      </div>

      <!-- Context / reassurance -->
      <div class="mb-4">
        <p class="mb-2 text-body-secondary small">
          Continue to the authorization server to sign in securely.
        </p>
      </div>

      <!-- Primary action -->
      <button type="button"
              class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2"
              (click)="login()" aria-label="Sign in to Shipyard">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
        <span>Sign in</span>
      </button>

      <!-- Help / Troubleshooting -->
      <div class="mt-3 text-center">
        <a class="btn btn-link p-0 small d-inline-flex align-items-center gap-1" href="https://github.com/etherfactor/shipyard/issues">
          <i class="bi bi-github" aria-hidden="true"></i>
          Having an issue?
        </a>
      </div>

    </div>

    <div class="badge bg-primary position-absolute" style="bottom: 15px; right: 15px;">Version: 1.0.0</div>
  </div>
</div>
