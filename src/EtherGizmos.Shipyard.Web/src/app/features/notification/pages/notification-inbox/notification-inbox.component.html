<!-- Header -->
<div class="row">
  <div class="col-12 mt-3">

    <detail-header text="Notifications"
                   subtext="View your received notifications." />

  </div>
</div>

<!-- Search -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-funnel"
                text="Notification Search">
      <div class="row align-items-end">
        <div class="col-md-4 mt-3">
          <label>Contents</label>
          <input type="text" class="form-control" placeholder="Search package, carrier, etc." />
        </div>
        <div class="col-md-3 mt-3">
          <label>State</label>
          <select class="form-select">
            <option>Unread</option>
            <option>All</option>
          </select>
        </div>
        <div class="col-md-3 mt-3">
          <label>Event type</label>
          <select class="form-select">
            <option [value]="''">All</option>
            @for (event of events; track event.id) {
            <option [value]="event.id">{{event.name}}</option>
            }
          </select>
        </div>
        <div class="col-md-2 mt-3">
          <button class="btn btn-primary w-100">
            Search
          </button>
        </div>
      </div>
    </detail-box>
  </div>
</div>

<!-- List -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-mailbox"
                text="Notification Inbox"
                [buttons]="notificationInboxButtons$$()">

      <div class="list-group mt-3">
        @for (notification of notifications; track notification.id) {
        <app-notification-row [notification]="notification" />
        }
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="compact-muted">Showing 3 of 18 notifications</div>
        <nav aria-label="Notification pages">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled"><a class="page-link">Previous</a></li>
            <li class="page-item active"><a class="page-link">1</a></li>
            <li class="page-item"><a class="page-link">2</a></li>
            <li class="page-item"><a class="page-link">3</a></li>
            <li class="page-item"><a class="page-link">Next</a></li>
          </ul>
        </nav>
      </div>

    </detail-box>
  </div>
</div>
