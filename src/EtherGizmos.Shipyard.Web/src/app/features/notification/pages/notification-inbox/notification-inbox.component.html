<!-- Header -->
<div class="row">
  <div class="col-12 mt-3">

    <detail-header text="Notifications"
                   subtext="View your received notifications." />

  </div>
</div>

<!-- Search -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-funnel"
                text="Notification Search">
      <div class="row align-items-end">
        <div class="col-md-4 mt-3">
          <label>Contents</label>
          <input type="text" class="form-control" [(ngModel)]="searchContents" placeholder="Search package, carrier, etc." />
        </div>
        <div class="col-md-3 mt-3">
          <label>State</label>
          <select class="form-select">
            <option>Unread</option>
            <option>All</option>
          </select>
        </div>
        <div class="col-md-3 mt-3">
          <label>Event type</label>
          <ng-select [clearable]="false"
                     [selectOnTab]="true"
                     [(ngModel)]="searchEventId">
            <ng-option value="__all">
              <span class="bi bi-check-all"></span>
              All
            </ng-option>
            @for (event of events; track event.id) {
            <ng-option [value]="event.id">
              <span [innerHtml]="formatStyleSpan(NotificationEventTheme, event.id)"></span>
              {{event.name}}
            </ng-option>
            }
          </ng-select>
        </div>
        <div class="col-md-2 mt-3">
          @if (!isLoading()) {
          <button class="btn btn-primary w-100" (click)="search()">
            Search
          </button>
          } @else {
          <button class="btn btn-primary w-100" type="button" disabled>
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            <span class="visually-hidden" role="status">Loading...</span>
          </button>
          }
        </div>
      </div>
    </detail-box>
  </div>
</div>

<!-- List -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-mailbox"
                text="Notification Inbox"
                [buttons]="notificationInboxButtons$$()">

      <div class="list-group mt-3">
        @if (!isLoading()) {

        @for (notification of records; track notification.id) {
        <notification-row [notification]="notification" />
        } @empty {
        No recent notifications
        }

        } @else {
        <div style="min-height: 100px;">
          <div class="position-absolute" style="top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
            <div class="position-absolute" style="top: 50%; left: 50%; transform: translateX(-50%) translateY(-50%);">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
        }
      </div>

      <div class="mt-3 d-flex justify-content-center">
        <ngb-pagination [collectionSize]="count"
                        [pageSize]="perPage"
                        [page]="page"
                        (pageChange)="page = $event; search()"
                        [maxSize]="5"
                        [rotate]="true"
                        [boundaryLinks]="true"
                        [directionLinks]="true"></ngb-pagination>
      </div>

    </detail-box>
  </div>
</div>
