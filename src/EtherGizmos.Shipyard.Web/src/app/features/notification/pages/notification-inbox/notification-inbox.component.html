<!-- Header -->
<div class="row">
  <div class="col-12 mt-3">

    <detail-header text="Notifications"
                   subtext="View your received notifications." />

  </div>
</div>

<!-- Search -->
<div class="row">
  <div class="col-12 mt-3">
    <detail-box icon="bi-funnel"
                text="Notification Search">
      <div class="row align-items-end">
        <div class="col-md-3 mt-3">
          <label>State</label>
          <select class="form-select">
            <option>Unread</option>
            <option>All</option>
          </select>
        </div>
        <div class="col-md-3 mt-3">
          <label>Event type</label>
          <select class="form-select">
            <option>All</option>
            <option>Package delivered</option>
          </select>
        </div>
        <div class="col-md-3 mt-3">
          <label>Contents</label>
          <input type="text" class="form-control" placeholder="Tracking # or contents" />
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-primary w-100">
            Search
          </button>
        </div>
      </div>
    </detail-box>
  </div>
</div>

  <div class="col-12 mt-3">
