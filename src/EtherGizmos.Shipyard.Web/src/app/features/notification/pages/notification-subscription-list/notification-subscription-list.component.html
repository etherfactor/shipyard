<!-- Header -->
<div class="row">
  <div class="col-12 mt-3">

    <detail-header text="Notification Subscriptions"
                   subtext="Configure the events Shipyard should notify you about." />

  </div>
</div>

<!-- Table -->
<div class="row">
  <div class="col-12 mt-3">

    <detail-box icon="bi-broadcast"
                text="Notification Subscriptions List">
      <div class="mt-3">
        <app-table [data]="records" [minRows]="perPage" [isLoading]="isLoading()"
                   [sort]="activeSort" (sortChange)="onSortChange($event)"
                   (filterChange)="onFilterChange($event)">
          <ng-template #headers>
            <th app-table-header="notificationEventId" class="text-nowrap"
                type="string"
                [sortable]="true"
                [filterable]="true"
                [operators]="['equals', 'not_equals']"
                [enumValues]="eventEnum$$()">
              Event
            </th>
            <th app-table-header="notificationChannelId" class="text-nowrap"
                type="string"
                [sortable]="true"
                [filterable]="true"
                [operators]="['equals', 'not_equals']"
                [enumValues]="channelEnum$$()">
              Channel
            </th>
            <th app-table-header="notificationScheduleId" class="text-nowrap"
                type="number"
                [sortable]="true"
                [filterable]="true"
                [operators]="['equals', 'not_equals']"
                [enumValues]="scheduleEnum$$()">
              Schedule
            </th>
            <th app-table-header="isActive"
                type="boolean"
                [sortable]="true"
                [filterable]="true"
                [operators]="['equals', 'not_equals']"
                [enumValues]="isActiveEnum$$()">
              Is active?
            </th>
            <th class="text-nowrap">
              Actions
            </th>
          </ng-template>

          <ng-template #rows let-row>
            <td class="text-nowrap">
              <span [innerHtml]="formatStyleSpan(NotificationEventTheme, row.notificationEventId)"></span>
              {{lookupName(events$$(), row.notificationEventId)}}
            </td>
            <td class="text-nowrap">
              <span [innerHtml]="formatStyleSpan(NotificationChannelTheme, row.notificationChannelId)"></span>
              {{lookupName(channels$$(), row.notificationChannelId)}}
            </td>
            <td class="text-nowrap">
              <span [innerHtml]="formatStyleSpan(NotificationScheduleTheme, row.notificationScheduleId)"></span>
              {{lookupName(schedules$$(), row.notificationScheduleId)}}
            </td>
            <td class="text-nowrap">
              @if (row.isActive) {
              <span class="bi bi-check-circle text-success"></span> Yes
              } @else {
              <span class="bi bi-x-circle text-danger"></span> No
              }
            </td>
            <td class="text-nowrap">
              <a [routerLink]="['/notifications', 'subscriptions', row.id]">View</a>
            </td>
          </ng-template>
        </app-table>
      </div>
      <div class="mt-3 d-flex justify-content-center">
        <ngb-pagination [collectionSize]="count"
                        [pageSize]="perPage"
                        [page]="page"
                        (pageChange)="page = $event; search()"
                        [maxSize]="5"
                        [rotate]="true"
                        [boundaryLinks]="true"
                        [directionLinks]="true"></ngb-pagination>
      </div>
    </detail-box>

  </div>
</div>
