<div class="d-flex gap-3">
  <span class="notification-icon"><i class="bi bi-truck"></i></span>
  <div class="flex-grow-1">
    <div class="d-flex justify-content-between gap-3">
      <div>
        <div class="fw-semibold">Package out for delivery</div>
        <div class="text-muted small">Tracking #9400 1000 0000 0000 · USPS · Today at 8:42 AM</div>
      </div>
      <span class="badge text-bg-primary align-self-start">Unread</span>
    </div>
    <p class="mb-2 mt-2">Your package is out for delivery and should arrive later today.</p>
    <div class="btn-group btn-group-sm">
      <button class="btn btn-secondary"><i class="bi bi-envelope-open me-1"></i> Mark read</button>
      @if ("packageId" in notification.payload) {
      <a class="btn btn-primary" [routerLink]="['/packages', notification.payload['packageId']]" [queryParams]="{ append: 1 }"><i class="bi bi-box-arrow-up-right me-1"></i> View package</a>
      }
    </div>
  </div>
</div>
